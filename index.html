<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World | 当前时间</title>
  <meta name="description" content="部署在 GitHub Pages 上的 Hello World 网站，实时显示当前时间。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header class="card__header">
      <span class="dot" aria-hidden="true"></span>
      <span class="badge">GitHub Pages · 静态托管</span>
    </header>

    <h1 class="hello">Hello World!</h1>
    <p class="subtitle">这是部署在 GitHub Pages 上的第一个网站，公网任何人可访问</p>

    <section class="time-panel" aria-live="polite">
      <div class="time-panel__label">
        <span>当前时间</span>
        <span class="status" id="status" data-state="ok">
          <i class="status__dot" aria-hidden="true"></i>
          <span id="status-text">走时中</span>
        </span>
      </div>

      <div class="clock" id="clock">--:--:--</div>

      <div class="date-line">
        <span id="date-text">正在获取时间…</span>
        <span class="divider"></span>
        <span id="weekday-text"></span>
      </div>

      <div class="meta">
        <span>完整时间：<strong id="full-time">—</strong></span>
        <span>时区：<strong id="timezone">—</strong></span>
        <span>托管方式：<strong id="hosting">GitHub Pages（静态）</strong></span>
        <span>计时来源：<strong id="time-source">页面端计算</strong></span>
        <span>每秒刷新：<strong id="tick-count">0</strong> 次</span>
      </div>
    </section>

    <footer class="card__footer">
      <p>静态托管没有后端服务，时间由页面按浏览器时钟每秒计算</p>
      <button type="button" id="refresh" class="btn">立即刷新</button>
    </footer>
  </main>

  <script>
    (function () {
      'use strict';

      var WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      var els = {
        clock: document.getElementById('clock'),
        dateText: document.getElementById('date-text'),
        weekdayText: document.getElementById('weekday-text'),
        fullTime: document.getElementById('full-time'),
        timezone: document.getElementById('timezone'),
        tickCount: document.getElementById('tick-count'),
        refresh: document.getElementById('refresh')
      };

      var ticks = 0;

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function render() {
        var now = new Date();
        var dateText = now.getFullYear() + ' 年 ' + pad(now.getMonth() + 1) + ' 月 ' + pad(now.getDate()) + ' 日';
        var timeText = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        var weekday = WEEKDAYS[now.getDay()];

        els.clock.textContent = timeText;
        els.dateText.textContent = dateText;
        els.weekdayText.textContent = weekday;
        els.fullTime.textContent = dateText + ' ' + weekday + ' ' + timeText;

        ticks += 1;
        els.tickCount.textContent = String(ticks);
      }

      try {
        els.timezone.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || '本地时区';
      } catch (e) {
        els.timezone.textContent = '本地时区';
      }

      render();
      setInterval(render, 1000);

      els.refresh.addEventListener('click', function () {
        render();
        location.reload();
      });

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) render();
      });
    })();
  </script>
</body>
</html>
